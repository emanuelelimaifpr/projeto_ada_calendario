<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendário das Cientistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Cormorant+Garamond:wght@500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="faixa">
<header class="topo container-xl">
  <div class="intro">
    <h1>Calendário das Cientistas</h1>
    <p>Nascimentos, homenagens e marcos de mulheres que fizeram ciência. Navegue por qualquer ano e toque em um nome para conhecer a história completa.</p>
  </div>
  <div class="faixa2">
    <img class=imgcabecalho src="img/logo_ada_bege.png" alt="logo projeto Ada">
    <section id="hoje" class="hoje" aria-live="polite"></section>
    
  </div>
 
</header>
</div>

<main class="container-xl">
  <div class="barra">
    <div class="nav-mes">
      <button id="ant" class="btn btn-outline-dark" aria-label="Mês anterior">‹</button>
      <h2 id="titulo" class="mes-titulo"></h2>
      <button id="prox" class="btn btn-outline-dark" aria-label="Próximo mês">›</button>
    </div>
    <div class="ir">
      <label class="visually-hidden" for="selMes">Mês</label>
      <select id="selMes" class="form-select"></select>
      <label class="visually-hidden" for="inpAno">Ano</label>
      <input id="inpAno" class="form-control" type="number" min="1" max="9999" inputmode="numeric">
      <button id="btnHoje" class="btn btn-dark">Hoje</button>
    </div>
  </div>
  <div id="filtros" class="filtros" role="group" aria-label="Filtros"></div>

  <div class="semana" aria-hidden="true"></div>
  <div id="grade" class="grade"></div>

  <section id="marcos" class="marcos"></section>
</main>

<footer class="container-xl rodape" id="rodape">


</footer>

<div class="modal fade" id="modal" tabindex="-1" aria-labelledby="mTitulo" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="mTitulo"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body" id="mCorpo"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="cientistas.js"></script>
<script src="app.js"></script>
</body>
</html>
